<!DOCTYPE html>
<html >
<head>
    
    <title>Form example</title>
</head>
<body>
    <form>
        Firstname : <input type="text" name="Firstname"><br><br>
        Lastname : <input type="text" name="Lastname"><br><br>
        Email id: <input type="email"  name="Email"><br><br>
        Password : <input type="password" name="Password"><br><br>
        Gender : <input type="radio" name="Gender" value="Male"> Male
        <input type="radio" name="Gender" value="Female"> Female
        <input type="radio" name="Gender" value="Others"> Others <br><br>
        Address: <input type="textarea" name="Address"><br><br>
        Hobbies: <input type="checkbox" name=""Hobbies value="Reading">Reading
        <input type="checkbox" name=""Hobbies value="Travelling">Travelling
        <input type="checkbox" name=""Hobbies value="Cooking">Cooking <br><br>
        Branch:
        <select  name="branch">
            <option value="CSE" > CSE </option>
            <option value="Civil" > Civil </option>
            <option value="Mechnical"> Machnical </option>
        </select><br><br>
        Submit:<input type="submit" value="Submit"><br><br>
        Reset:<input type="reset" value="Reset"><br>
    </form>
</body>
</html>
